
spring:
  application:
    name: logstream

server:
  port: 8080

logstream:
  ingestion:
    grpc-port: ${LOGSTREAM_GRPC_PORT:9090}
    index-path: ${LOGSTREAM_INDEX_PATH:index-data}
    max-batch-size: 1000
    ram-buffer-mb: 64
    refresh-interval: 1s
    commit-interval: 5s
    max-inbound-message-mb: 16
